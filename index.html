<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Translerr</title>
<style>
:root{color-scheme:dark;--background:#15110e;--panel:#201a15;--line:#41362c;--text:#f5ede4;--muted:#bdb0a2;--amber:#ffad3d;--ink:#231405}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--text);font:16px system-ui}
main{max-width:1540px;margin:auto;padding:0 clamp(16px,3vw,44px) 32px}
header{padding:16px 0;border-bottom:1px solid var(--line);gap:12px}
header nav,.toolbar,#selection,#media-filter{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px}
.brand span{display:grid;place-items:center;border-radius:50%;width:36px;height:36px;background:var(--amber);color:var(--ink)}
h1{margin:32px 0 0;font-size:36px;letter-spacing:-.04em}
h2{margin:0;font-size:19px}
p,small{color:var(--muted)}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:20px;margin-top:24px;align-items:start}
.panel,dialog{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-width:0}
.library-panel{overflow:hidden}
form,.activity{display:grid;gap:14px;padding:18px}
.activity{margin-top:16px}
label{display:grid;gap:7px;font-weight:600}
button,input,select,.nav-button{min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#17120e;color:inherit;font:inherit}
button,.nav-button{cursor:pointer;font-weight:650;text-decoration:none}
button:disabled{opacity:.5;cursor:default}
button:hover:not(:disabled),.nav-button:hover{border-color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#submit,#regenerate-submit,#media-filter [aria-pressed="true"],#existing-results [aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.toolbar,#selection{padding:12px 14px;border-bottom:1px solid var(--line)}
#filter{flex:1 1 170px}
#count{margin-right:auto;color:var(--muted)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:11px 14px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
td:first-child{width:44px;text-align:center}
tr:has(input:checked){background:#302316}
td small{display:block;margin-top:3px}
input[type=checkbox]{accent-color:var(--amber);width:17px;height:17px}
#status,#issues{margin:0;overflow-wrap:anywhere}
#issues:empty,#scan-note:empty{display:none}
#scan-note,#empty{margin:12px 14px}
#scan-note{color:#ff9470}
progress{width:100%;accent-color:var(--amber)}
[hidden]{display:none!important}
dialog{color:inherit;width:min(680px,calc(100% - 32px));padding:0}
dialog::backdrop{background:#0009}
#existing-results{display:grid;gap:4px;max-height:220px;overflow:auto}
#existing-results button{text-align:left}
@media(max-width:800px){.workspace{grid-template-columns:1fr}.workspace aside{grid-row:1}}

#translate,.activity{padding:22px;gap:16px;border-radius:22px;background:linear-gradient(155deg,#211c17,#191511);box-shadow:0 12px 28px #08060435}
#translate h2{margin-bottom:6px}
.sparkle{color:var(--amber);margin-right:4px}
#translate label{color:var(--muted);font-weight:500}
#translate select{border-radius:20px;padding:11px 14px;color:var(--text);font-weight:400}
#translate button{width:100%;border-radius:13px}
#translate #submit{padding:13px;background:#ffa52b}
#translate #open-regenerate{background:#211b16;font-weight:500}
#open-regenerate::before{content:"↻";margin-right:8px}
#submit::before{content:"✧";margin-right:8px}
.activity-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}
.activity-heading h2{font-size:16px;font-weight:600}
.activity-heading.is-active h2::before{content:"";display:inline-block;background:var(--amber);border-radius:50%;width:8px;height:8px;margin-right:8px}
#activity-count,#status{color:var(--muted)}
#activity-count{font:13px ui-monospace,monospace;white-space:nowrap}
#activity-video{margin:0;color:var(--text);overflow-wrap:anywhere}
#progress{order:0;height:8px;appearance:none;border:0;border-radius:8px;overflow:hidden;background:#272019}
#progress::-webkit-progress-bar{background:#272019}
#progress::-webkit-progress-value{background:repeating-linear-gradient(45deg,#ffa52b 0 7px,#ffc16a 7px 14px);border-radius:8px}
#progress::-moz-progress-bar{background:repeating-linear-gradient(45deg,#ffa52b 0 7px,#ffc16a 7px 14px);border-radius:8px}
</style>
<main>
<header style="display:flex;align-items:center;justify-content:space-between"><strong class="brand"><span aria-hidden="true">文</span>Translerr</strong><nav><a class="nav-button" href="/admin">Admin settings</a><button class="nav-button" type="button" id="logout">Sign out</button></nav></header>
<h1>Library</h1>
<p>Translate English subtitles for movies and TV episodes.</p>
<div class="workspace">
<section class="panel library-panel" aria-label="Missing subtitles">
<div class="toolbar">
<input id="filter" type="search" placeholder="Search titles…" aria-label="Search titles">
<div id="media-filter" role="group" aria-label="Media type">
<button type="button" data-type="" aria-pressed="true">All</button>
<button type="button" data-type="Movies" aria-pressed="false">Movies</button>
<button type="button" data-type="TV" aria-pressed="false">TV</button>
</div>
<button id="refresh-library" type="button" disabled>Refresh</button>
</div>
<div id="selection">
<span id="count" aria-live="polite">0 selected</span>
<button id="all" type="button">Select all shown</button>
<button id="clear" type="button">Unselect all</button>
</div>
<div id="items">
<table aria-label="Movies and episodes missing subtitles">
<tbody id="library"></tbody>
</table>
<p id="empty" hidden>No matching titles.</p>
</div>
<p id="scan-note" role="status"></p>
</section>
<aside>
<form id="translate" class="panel">
<h2><span class="sparkle" aria-hidden="true">✧</span> Translate</h2>
<label>AI provider<select id="provider" required></select></label>
<label>Target language<select id="code" required></select></label>
<button id="submit" disabled>Translate selected</button>
<button id="open-regenerate" type="button" disabled>Regenerate subtitle</button>
</form>
<section class="panel activity" aria-label="Translation activity">
<div class="activity-heading"><h2 id="activity-title">Activity</h2><span id="activity-count"></span></div>
<p id="activity-video" hidden></p>
<progress id="progress" aria-label="Subtitle translation progress" max="100" hidden></progress>
<p id="status" role="status">Loading episodes…</p>
<div id="queue-actions" hidden>
<button type="button" id="resume">Resume queue</button>
<button type="button" id="discard">Discard remaining items</button>
</div>
<ul id="issues"></ul>
</section>
</aside>
</div>
</main>
<dialog id="regenerate-dialog">
<form id="regenerate">
<h2>Regenerate subtitle</h2>
<label>Search videos with subtitles<input id="existing-filter" type="search"></label>
<div id="existing-results" role="group" aria-label="Matching videos"></div>
<label>English source<select id="english-source" required></select></label>
<p>The current subtitle is backed up when the replacement is ready.</p>
<button id="regenerate-submit" disabled>Regenerate</button>
<button type="button" id="close-regenerate">Cancel</button>
<p id="regenerate-status" role="status"></p>
</form>
</dialog>
<script>
const el = id => document.getElementById(id);
el('logout').onclick = async () => {
  const response = await fetch('/logout', {method: 'POST',
    headers: {'X-Translaterr-Token': '__TOKEN__'}, body: '{}'});
  if (response.ok) location.assign('/login');
};
const selected = new Set();
const fields = ['provider', 'code'];
let episodes = [];
let mediaType = "";
let active = false;
let paused = false;
let sending = false;
let loading = true;
let refreshed = '';
let listVersion = 0;
function visible() {
  const query = el('filter').value.trim().toLowerCase();
  return episodes.filter(name => (!mediaType || name.startsWith(mediaType + "/")) && name.toLowerCase().includes(query));
}
function controls() {
  el('submit').disabled = loading || active || paused || sending || !selected.size || !el('provider').value;
  el('refresh-library').disabled = loading || !el('code').value;
  el('open-regenerate').disabled = active || paused || sending || loading || !el('provider').value;
  el('submit').textContent = selected.size ? 'Translate ' + selected.size + ' selected' : 'Translate selected';
  el('clear').disabled = !selected.size;
  el('all').disabled = loading || !visible().some(name => !selected.has(name));
  el('count').textContent = selected.size + ' selected';
}
function render() {
  const rows = visible().map(name => {
    const row = document.createElement('tr');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = selected.has(name);
    checkbox.setAttribute('aria-label', 'Select ' + name);
    checkbox.onchange = () => {
      if (checkbox.checked) selected.add(name);
      else selected.delete(name);
      controls();
    };
    row.insertCell().append(checkbox);
    const title = row.insertCell();
    title.append(document.createTextNode(videoLabel(name)));
    const filename = document.createElement('small');
    filename.textContent = name.split('/').at(-1);
    title.append(filename);
    return row;
  });
  el('library').replaceChildren(...rows);
  el('empty').hidden = loading || Boolean(rows.length);
  controls();
}
async function reload() {
  const version = ++listVersion;
  loading = true;
  controls();
  el('scan-note').textContent = 'Checking subtitle files and embedded tracks…';
  try {
    const code = el('code').value.trim();
    const response = await fetch('/episodes?code=' + encodeURIComponent(code));
    if (!response.ok) throw Error('Library request failed');
    const data = await response.json();
    if (version !== listVersion) return;
    episodes = data.episodes;
    el('scan-note').textContent = data.unreadable
      ? data.unreadable + ' files could not be checked and were excluded.' : '';
    const available = new Set(episodes);
    for (const name of selected) if (!available.has(name)) selected.delete(name);
    const provider = el('provider');
    const previous = provider.value;
    provider.replaceChildren(...data.providers.map(name =>
      new Option(name === 'openai' ? 'OpenAI' : 'Anthropic Claude', name)));
    if (data.providers.includes(previous)) provider.value = previous;
    el('status').textContent = !episodes.length ? 'No files missing subtitles for this language.'
      : !provider.value ? 'Configure an API key and model in Compose.' : 'Ready';
    render();
  } catch {
    if (version === listVersion) el('scan-note').textContent = 'Could not check library subtitles.';
  } finally {
    if (version === listVersion) {
      loading = false;
      el('empty').hidden = Boolean(visible().length);
      controls();
    }
  }
}
async function poll() {
  if (sending) return;
  try {
    const job = await fetch('/status').then(r => r.json());
    active = job.active;
    paused = Boolean(job.paused);
    el('queue-actions').hidden = !paused;
    const revision = job.run + ':' + job.saved;
    if (job.run && revision !== refreshed && job.saved) {
      refreshed = revision;
      await reload();
    }
    const current = job.active && job.message.match(/^(\d+)\/(\d+) · (.+) · (.+)$/);
    const cues = current && current[4].match(/cues (\d+)–(\d+) of (\d+)/i);
    el('activity-title').textContent = job.active ? 'Translating' : job.paused ? 'Paused' : 'Activity';
    el('activity-title').parentElement.classList.toggle('is-active', job.active);
    el('activity-count').textContent = current ? current[1] + ' / ' + current[2] : '';
    el('activity-video').hidden = !current;
    el('activity-video').textContent = current ? current[3] : '';
    el('progress').hidden = !cues;
    if (cues) {
      const percent = Math.floor(100 * (Number(cues[1]) - 1) / Number(cues[3]));
      el('progress').value = percent;
      el('status').textContent = 'Cues ' + cues[1] + '–' + cues[2] + ' of ' + cues[3] + ' · ' + percent + '%';
    } else if (job.run) {
      el('status').textContent = current ? current[4] : job.message;
    }
    el('issues').replaceChildren(...(job.issues || []).map(message => {
      const item = document.createElement('li');
      item.textContent = message;
      return item;
    }));
    controls();
  } catch { el('status').textContent = 'Lost contact with Translerr.'; }
}
for (const action of ['resume', 'discard']) {
  el(action).onclick = async () => {
    if (action === 'discard' && !confirm('Discard the remaining queued titles?')) return;
    try {
      const response = await fetch('/queue/' + action, {
        method: 'POST', headers: {'X-Translaterr-Token': '__TOKEN__'}
      });
      if (!response.ok) throw Error((await response.json()).message);
      await poll();
    } catch (error) { el('status').textContent = error.message; }
  };
}
el('refresh-library').onclick = reload;
window.addEventListener('focus', () => {
  if (!loading && el('code').value) reload();
});
for (const button of el('media-filter').querySelectorAll('button')) {
  button.onclick = () => {
    mediaType = button.dataset.type;
    for (const option of el('media-filter').children) {
      option.setAttribute('aria-pressed', String(option === button));
    }
    render();
  };
}
el('filter').oninput = render;
el('all').onclick = () => { for (const name of visible()) selected.add(name); render(); };
el('clear').onclick = () => { selected.clear(); render(); };
el('code').onchange = () => { selected.clear(); reload(); };
el('provider').onchange = controls;
const dialog = el('regenerate-dialog');
let sourceRequest = 0;
let existingVideos = [];
let selectedVideo = '';
function videoLabel(path) {
  const [library, folder, ...rest] = path.split('/');
  const filename = rest.at(-1) || folder;
  const stem = filename.replace(/\.[^.]+$/, '');
  if (library === 'Movies') return rest.length ? folder : stem;
  const episode = stem.match(/S\d{1,3}E\d{1,4}(?:E\d{1,4})*/i);
  return rest.length && episode ? folder + ' · ' + episode[0].toUpperCase() : stem;
}
function renderExistingVideos() {
  const query = el('existing-filter').value.trim().toLowerCase();
  const matches = existingVideos.filter(path =>
    videoLabel(path).toLowerCase().includes(query) || path.toLowerCase().includes(query));
  if (selectedVideo && !matches.includes(selectedVideo)) {
    selectedVideo = '';
    showSources();
  }
  el('existing-results').replaceChildren(...matches.map(path => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = videoLabel(path);
    button.title = path.split('/').at(-1);
    button.setAttribute('aria-pressed', String(path === selectedVideo));
    button.onclick = () => {
      selectedVideo = path;
      for (const row of el('existing-results').children) {
        row.setAttribute('aria-pressed', String(row === button));
      }
      showSources();
    };
    return button;
  }));
  if (!selectedVideo) el('regenerate-status').textContent = matches.length ? '' : 'No videos match this search.';
}
el('existing-filter').oninput = renderExistingVideos;
async function showSources() {
  const request = ++sourceRequest;
  const video = selectedVideo;
  el('english-source').replaceChildren();
  el('regenerate-submit').disabled = true;
  if (!video) return;
  el('regenerate-status').textContent = 'Checking English tracks…';
  try {
    const params = new URLSearchParams({video, code: el('code').value});
    const response = await fetch('/english-sources?' + params);
    const data = await response.json();
    if (request !== sourceRequest) return;
    if (!response.ok) throw Error(data.message);
    el('english-source').replaceChildren(...data.sources.map(([id, label]) => new Option(label, id)));
    el('regenerate-submit').disabled = !data.sources.length;
    el('regenerate-status').textContent = data.sources.length ? '' : 'No supported English sources found.';
  } catch (error) {
    if (request === sourceRequest) el('regenerate-status').textContent = error.message;
  }
}
el('open-regenerate').onclick = async () => {
  existingVideos = [];
  el('existing-filter').value = el('filter').value;
  selectedVideo = '';
  ++sourceRequest;
  el('existing-results').replaceChildren();
  el('english-source').replaceChildren();
  el('regenerate-submit').disabled = true;
  el('regenerate-status').textContent = 'Finding existing subtitles…';
  dialog.showModal();
  try {
    const response = await fetch('/existing-subtitles?code=' + encodeURIComponent(el('code').value));
    const data = await response.json();
    if (!response.ok) throw Error(data.message);
    existingVideos = data.videos;
    renderExistingVideos();
  } catch (error) { el('regenerate-status').textContent = error.message; }
};
el('close-regenerate').onclick = () => dialog.close();
el('regenerate').onsubmit = async event => {
  event.preventDefault();
  el('regenerate-submit').disabled = true;
  try {
    const response = await fetch('/regenerate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Translaterr-Token': '__TOKEN__'},
      body: JSON.stringify({
        video: selectedVideo, source: el('english-source').value,
        provider: el('provider').value, code: el('code').value
      })
    });
    const data = await response.json();
    if (!response.ok) throw Error(data.message);
    active = true;
    controls();
    dialog.close();
    el('status').textContent = data.message;
  } catch (error) {
    el('regenerate-status').textContent = error.message;
    el('regenerate-submit').disabled = false;
  }
};
el('translate').onsubmit = async event => {
  event.preventDefault();
  sending = true;
  controls();
  try {
    const response = await fetch('/translate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Translaterr-Token': '__TOKEN__'},
      body: JSON.stringify({...Object.fromEntries(fields.map(k => [k, el(k).value])),
        episodes: [...selected]})
    });
    const data = await response.json();
    el('status').textContent = data.message;
    if (response.ok) active = true;
  } catch { el('status').textContent = 'Could not submit the translation.'; }
  finally { sending = false; controls(); }
};
fetch('/languages').then(response => response.json()).then(languages => {
  el('code').replaceChildren(...Object.entries(languages)
    .sort((a, b) => a[1].localeCompare(b[1]))
    .map(([code, name]) => new Option(name, code)));
  el('code').value = 'et';
  return reload();
}).then(poll).catch(() => {
  el('status').textContent = 'Could not load target languages.';
});
setInterval(poll, 3000);
</script>
