<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Translerr</title>
<style>
*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;background:#101915;color:#f2f4e9;font:16px system-ui}
main{width:min(440px,calc(100% - 32px));padding:30px;background:#1a2821;border:1px solid #375044;border-radius:16px}
h1{margin:0;font-size:36px;letter-spacing:-.04em}p{color:#b6c6b8}form,label{display:grid;gap:8px}form{gap:16px}
input,button{padding:12px;border:1px solid #597263;border-radius:8px;background:#111d17;color:inherit;font:inherit}
button{background:#c8f487;color:#142011;font-weight:700;cursor:pointer}#status{min-height:1.4em;margin:0}
</style>
<main><h1>Translerr</h1><p id="intro">Sign in to your subtitle library.</p>
<form id="login">
<label id="user-row">Username<input id="username" value="admin" autocomplete="username" required></label>
<label><span id="password-label">Password</span><input id="password" type="password" autocomplete="current-password" required maxlength="256"></label>
<button id="submit">Sign in</button>
<p role="status" id="status"></p>
</form></main>
<script>
const change = __CHANGE__;
const el = id => document.getElementById(id);
if (change) {
  el('intro').textContent = 'Replace the default password to continue.';
  el('user-row').remove();
  el('password-label').textContent = 'New password';
  el('password').autocomplete = 'new-password';
  el('password').minLength = 12;
  el('submit').textContent = 'Set password';
}
el('login').onsubmit = async event => {
  event.preventDefault();
  el('submit').disabled = true;
  try {
    const response = await fetch(change ? '/change-password' : '/login', {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-Translaterr-Token': '__TOKEN__'},
      body: JSON.stringify({username: change ? 'admin' : el('username').value, password: el('password').value})
    });
    if (response.ok) location.assign('/');
    else el('status').textContent = (await response.json()).message;
  } catch { el('status').textContent = 'Could not connect to Translerr.'; }
  finally { el('submit').disabled = false; }
};
</script>
