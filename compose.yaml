services:
  translaterr:
    build: .
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-8787}:8080"
    environment:
      TRANSLERR_SETUP_PASSWORD: "${TRANSLERR_SETUP_PASSWORD:-}"
      TRANSLERR_SECURE_COOKIE: "${TRANSLERR_SECURE_COOKIE:-0}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
    volumes:
      - type: bind
        source: "${TV_PATH:?Set TV_PATH in .env}"
        target: /media/TV
        bind:
          create_host_path: false
      - type: bind
        source: "${MOVIES_PATH:?Set MOVIES_PATH in .env}"
        target: /media/Movies
        bind:
          create_host_path: false
      - type: bind
        source: "${STATE_PATH:-./state}"
        target: /state
        bind:
          create_host_path: false
